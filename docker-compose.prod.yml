version: '3.9'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finishline-frontend
    restart: unless-stopped
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:3000"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
